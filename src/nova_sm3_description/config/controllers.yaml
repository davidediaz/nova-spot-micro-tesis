controller_manager:
  ros__parameters:
    update_rate: 100

# Parameters consumed by the Gazebo Sim hardware bridge.  With position
# commands the bridge implements a first-order joint response; 0.5 is fast
# enough to track the crawl while remaining below the oscillatory limit.
gz_ros2_control:
  ros__parameters:
    hold_joints: true
    position_proportional_gain: 0.5

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - front_left_coxa_joint
      - front_left_femur_joint
      - front_left_tibia_joint
      - front_right_coxa_joint
      - front_right_femur_joint
      - front_right_tibia_joint
      - rear_left_coxa_joint
      - rear_left_femur_joint
      - rear_left_tibia_joint
      - rear_right_coxa_joint
      - rear_right_femur_joint
      - rear_right_tibia_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: true
