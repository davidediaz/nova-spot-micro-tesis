# MAPA PROPUESTO. No energizar hasta medir y completar cada calibración.
hardware_ready: false
i2c_bus: 1
pca9685_address: 0x40
pwm_frequency_hz: 50
oe_bcm_gpio: 17
watchdog_timeout_s: 0.5
require_measured_motion_limits: true

# Deben identificarse por servo. La interfaz PWM no puede imponer torque en un
# MG996R; torque_limite_nm queda como dato para supervisión/modelo. El límite de
# velocidad sí se aplicará mediante interpolación antes de habilitar hardware.
motion_limits:
  front_left_coxa_joint:  {max_velocity_rad_s: null, torque_limit_nm: null}
  front_left_femur_joint: {max_velocity_rad_s: null, torque_limit_nm: null}
  front_left_tibia_joint: {max_velocity_rad_s: null, torque_limit_nm: null}
  front_right_coxa_joint:  {max_velocity_rad_s: null, torque_limit_nm: null}
  front_right_femur_joint: {max_velocity_rad_s: null, torque_limit_nm: null}
  front_right_tibia_joint: {max_velocity_rad_s: null, torque_limit_nm: null}
  rear_left_coxa_joint:  {max_velocity_rad_s: null, torque_limit_nm: null}
  rear_left_femur_joint: {max_velocity_rad_s: null, torque_limit_nm: null}
  rear_left_tibia_joint: {max_velocity_rad_s: null, torque_limit_nm: null}
  rear_right_coxa_joint:  {max_velocity_rad_s: null, torque_limit_nm: null}
  rear_right_femur_joint: {max_velocity_rad_s: null, torque_limit_nm: null}
  rear_right_tibia_joint: {max_velocity_rad_s: null, torque_limit_nm: null}

# center_us, min_us, max_us y direction son valores provisionales deliberados.
# calibrated debe cambiarse individualmente después de asegurar y medir el servo.
servos:
  front_left_coxa_joint:  {channel: 0, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  front_left_femur_joint: {channel: 1, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  front_left_tibia_joint: {channel: 2, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  front_right_coxa_joint:  {channel: 3, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  front_right_femur_joint: {channel: 4, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  front_right_tibia_joint: {channel: 5, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  rear_left_coxa_joint:  {channel: 6, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  rear_left_femur_joint: {channel: 7, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  rear_left_tibia_joint: {channel: 8, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  rear_right_coxa_joint:  {channel: 9, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  rear_right_femur_joint: {channel: 10, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
  rear_right_tibia_joint: {channel: 11, center_us: 1500, min_us: 1000, max_us: 2000, direction: 1, calibrated: false}
